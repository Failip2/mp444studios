# mp444studios — nginx reverse proxy.
#
# Install as /etc/nginx/sites-available/mp444studios and symlink into
# sites-enabled. Run `certbot --nginx -d mp444studios.com -d www.mp444studios.com`
# afterwards; certbot rewrites the TLS block in place.
#
# The Next.js server listens on 127.0.0.1:3000 and is not reachable from
# outside. Everything below is about doing the two things nginx is better at
# than Node: terminating TLS, and serving the ~66 MB of immutable image
# derivatives straight off disk.

upstream mp444_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect apex and www over to canonical HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name mp444studios.com www.mp444studios.com;

    # Leave room for certbot's HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mp444studios.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mp444studios.com;

    ssl_certificate     /etc/letsencrypt/live/mp444studios.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mp444studios.com/privkey.pem;

    return 301 https://mp444studios.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mp444studios.com;

    ssl_certificate     /etc/letsencrypt/live/mp444studios.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mp444studios.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Photographs are the whole payload here; a 2100px AVIF is ~35 KB and there
    # are several hundred of them.
    client_max_body_size 4m;

    # AVIF and WebP are already compressed — re-compressing them wastes CPU for
    # nothing. Only the text payloads are worth gzipping.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff2;

    root /srv/mp444studios/public;

    # ------------------------------------------------------------ static files
    # Derived imagery. The path encodes the width, and a changed photo gets a
    # changed path, so these are safe to pin for a year.
    location /media/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri @app;
    }

    # Content-hashed build output.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        proxy_pass http://mp444_app;
    }

    # The CVs are replaced under the same filename, so they must revalidate.
    location /docs/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri @app;
    }

    # ------------------------------------------------------------- application
    location / {
        proxy_pass http://mp444_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    location @app {
        proxy_pass http://mp444_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
