{{ define "main" }}
<section class="landing-grid" aria-label="Primary choices">
  <!-- Camera Equipment test123 -->
  <a class="tile" href="{{ "/equipment/" | relURL }}">
    <figure class="tile-figure">
      <picture>
        <source srcset="/images/landing/equipment-1200.webp 1200w, /images/landing/equipment-800.webp 800w" type="image/webp" />
        <img
          src="/images/landing/equipment-800.jpg"
          srcset="/images/landing/equipment-1200.jpg 1200w, /images/landing/equipment-800.jpg 800w"
          sizes="(min-width: 900px) 33vw, 100vw"
          alt="Camera bodies and lenses on a table"
          loading="lazy"
          decoding="async"
        />
      </picture>
      <figcaption class="tile-caption">
        <span class="tile-title">Camera equipment</span>
        <span class="tile-sub">Gear list & specs</span>
      </figcaption>
    </figure>
  </a>

  <!-- Portfolio -->
  <a class="tile" href="{{ "/portfolio/" | relURL }}">
    <figure class="tile-figure">
      <picture>
        <source srcset="/images/landing/portfolio-1200.webp 1200w, /images/landing/portfolio-800.webp 800w" type="image/webp" />
        <img
          src="/images/landing/portfolio-800.jpg"
          srcset="/images/landing/portfolio-1200.jpg 1200w, /images/landing/portfolio-800.jpg 800w"
          sizes="(min-width: 900px) 33vw, 100vw"
          alt="Sample photo spread"
          loading="lazy"
          decoding="async"
        />
      </picture>
      <figcaption class="tile-caption">
        <span class="tile-title">Portfolio</span>
        <span class="tile-sub">Photo & video work</span>
      </figcaption>
    </figure>
  </a>

  <!-- CV -->
  <a class="tile" href="{{ "/cv/" | relURL }}">
    <figure class="tile-figure">
      <picture>
        <source srcset="/images/landing/cv-1200.webp 1200w, /images/landing/cv-800.webp 800w" type="image/webp" />
        <img
          src="/images/landing/cuh-800.jpg"
          srcset="/images/landing/cuh-1200.jpg 1200w, /images/landing/cuh-800.jpg 800w"
          sizes="(min-width: 900px) 33vw, 100vw"
          alt="Clean résumé layout on desk"
          loading="lazy"
          decoding="async"
        />
      </picture>
      <figcaption class="tile-caption">
        <span class="tile-title">CV</span>
        <span class="tile-sub">Experience & contact</span>
      </figcaption>
    </figure>
  </a>
</section>
{{ end }}
