{{ define "main" }}
<section class="portfolio-grid">
  {{ range .Pages.ByWeight }}
    {{/* normalize cover into a string */}}
    {{ $cover := "" }}
    {{ with .Params.cover }}
      {{ if (isset . "image") }}
        {{ $cover = .image }}
      {{ else }}
        {{ $cover = . }}
      {{ end }}
    {{ end }}

    <a class="tile" href="{{ .RelPermalink }}">
      <figure class="tile-figure">
        {{ with $cover }}
          <img src="{{ . | relURL | safeURL }}" alt="{{ $.Title }}">
        {{ end }}
        <figcaption class="tile-caption">
          <span class="tile-title">{{ .Title }}</span>
          {{ with .Params.subtitle }}<span class="tile-sub">{{ . }}</span>{{ end }}
        </figcaption>
      </figure>
    </a>
  {{ end }}
</section>
{{ end }}
